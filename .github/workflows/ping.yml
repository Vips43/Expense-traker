name: Minute Ping Website

on:
  schedule:
    # Runs every minute
    - cron: '* * * * *'
  workflow_dispatch: # Allows you to trigger the ping manually from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Website
        run: curl -I -s https://www.expense-traker-neon.vercel.app/api/ping